shows:
  invocaciones:
    status: "In creazione · debutto estate 2027"
    chips: ["40 min", "Strada / spazio non convenzionale", "Cerimonia partecipata"]
    description: "Una cerimonia di circo contemporaneo tra performance e rito. Il corpo travesti occupa il centro per evocare le memorie queer che le arti sceniche in Spagna hanno cancellato. Il pubblico non guarda: partecipa."
  circografia:
    chips: ["50 min", "Sala (adattabile in strada)", "Musica dal vivo"]
    description: "Un viaggio autobiografico nell'infanzia e nell'adolescenza queer che Victoria non ha potuto vivere. Un guasto tecnico nel bel mezzo di un concerto la trascina in una realtà parallela, dove i peluche della sua infanzia la guidano attraverso il suo passato, tra modelli femminili e la socializzazione maschile che le è stata imposta."
    techniques: "Ruota Cyr, acrobatica, pattini e trampoli · testo e proiezioni"

about:
  eyebrow: "Chi sono"
  name: "Vic Heredero"
  paragraphs:
    - "Victoria Sickness è il nome d'arte di Vic Heredero, artista di circo che intreccia tecnica, creazione e ricerca scenica. Formazione al Centre de les Arts del Circ Rogelio Rivel (2016–2020), con specializzazione in ruota Cyr e acrobatica a terra, dopo gli studi in Ingegneria dei Sistemi Audiovisivi all'Universidad Carlos III di Madrid."
    - "Dal 2018 voce principale e sax tenore di Las Marikarmen, di cui cura anche la messa in scena. Con la compagnia: un assolo di 12 minuti, lo spettacolo di 50 minuti Circografía de una Travesti e la ricerca in corso sul corpo travesti, INVOCACIONES."
    - "Conduce laboratori di tecnica e creazione alla scuola Rogelio Rivel, dove dirige un cabaret annuale. Ha diretto il Circ de Nadal 2024 all'Espai de Circ Cronopis (Mataró), partecipa alla caixa d'eines de La Central del Circ, è in residenza a La Poderosa (2026/27) e ha recitato in Combinat 57 all'Ateneu Popular 9 Barris."
  quote: "Alcune di noi non possono permettersi il lusso di non metterci il corpo."
  portrait_alt: "Ritratto di Victoria Sickness"
  photo_alt: "Victoria Sickness, foto"

