shows:
  invocaciones:
    status: "Sorkuntzan · estreinaldia 2027ko udan"
    chips: ["40 min", "Kalea / ohiz kanpoko espazioa", "Zeremonia parte-hartzailea"]
    description: "Performancearen eta errituaren arteko zirku garaikideko zeremonia bat. Gorputz trabestiak erdigunea hartzen du Espainiako arte eszenikoek ezabatu dituzten memoria queerrak deitzeko. Publikoak ez du begiratzen: parte hartzen du."
  circografia:
    chips: ["50 min", "Areto (kalera egokigarria)", "Zuzeneko musika"]
    description: "Victoriak bizi ezin izan zuen haurtzaro eta nerabezaro queerrera egindako bidaia autobiografikoa. Kontzertu baten erdian akats tekniko batek errealitate paralelo batera eramaten du, eta han haurtzaroko peluxeek bere iraganean barrena gidatzen dute, emakume-erreferenteen eta inposatu zitzaion gizonezko sozializazioaren artean."
    techniques: "Cyr gurpila, akrobazia, patinak eta zankoak · testua eta proiekzioak"

about:
  eyebrow: "Niri buruz"
  name: "Vic Heredero"
  paragraphs:
    - "Victoria Sickness Vic Herederoren izen artistikoa da: teknika, sorkuntza eta ikerketa eszenikoa gurutzatzen dituen zirku-artista. Centre de les Arts del Circ Rogelio Rivel eskolan ikasi zuen (2016–2020), Cyr gurpilean eta lurreko akrobazian espezializatuta, Madrilgo Universidad Carlos III-n Sistema Ikus-entzunezkoen Ingeniaritza ikasi ondoren."
    - "2018tik Las Marikarmen taldeko ahots nagusia eta saxofoi tenorra da, eta taldearen eszenaratzea ere zuzentzen du. Konpainiarekin 12 minutuko bakarlana, 50 minutuko Circografía de una Travesti ikuskizuna eta gorputz trabestiari buruzko INVOCACIONES ikerketa (abian) sortu ditu."
    - "Teknika eta sorkuntza tailerrak ematen ditu Rogelio Rivel eskolan, eta bertako urteroko kabareta zuzentzen du. 2024ko Circ de Nadal zuzendu zuen Espai de Circ Cronopis-en (Mataró), La Central del Circ-eko caixa d'eines programan parte hartzen du, La Poderosan egoiliar da (2026/27) eta Ateneu Popular 9 Barris-eko Combinat 57-n aritu da."
  quote: "Batzuok ezin dugu gorputza ez jartzearen luxua onartu."
  portrait_alt: "Victoria Sicknessen erretratua"
  photo_alt: "Victoria Sickness, argazkia"

