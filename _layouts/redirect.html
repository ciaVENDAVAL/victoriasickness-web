<!doctype html>
<html lang="{{ page.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <title>→ {{ page.to }}</title>

</head>
<body><a href="{{ page.to | relative_url }}">{{ site.url }}{{ page.to }}</a></body>
</html>
