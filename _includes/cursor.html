<!-- Custom cursor: dot + press ring; long press reveals the BACK of a right hand getting its nails painted -->
<div class="cursor" aria-hidden="true">
  <svg class="cursor__ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" /></svg>
  <span class="cursor__dot"></span>
  <svg class="cursor__hand" viewBox="0 0 120 150">
    <g class="hand">
      <!-- thumb (left side = back of a right hand) -->
      <g transform="rotate(-38 30 116)">
        <rect class="skin" x="21" y="70" width="18" height="50" rx="9" />
        <path class="knuckle" d="M25 96 q5 2 10 0" />
        <path class="nail" d="M24.5 74 h11 v9 q0 6 -5.5 6 q-5.5 0 -5.5 -6z" />
        <path class="nail-paint" data-nail="4" d="M24.5 74 h11 v9 q0 6 -5.5 6 q-5.5 0 -5.5 -6z" />
        <rect class="gloss" x="26.6" y="76" width="2.2" height="5" rx="1.1" />
      </g>
      <!-- fingers -->
      <rect class="skin" x="27" y="20" width="16" height="62" rx="8" />
      <rect class="skin" x="45" y="8"  width="16" height="74" rx="8" />
      <rect class="skin" x="63" y="14" width="16" height="68" rx="8" />
      <rect class="skin" x="81" y="32" width="14" height="52" rx="7" />
      <!-- back of hand -->
      <path class="skin" d="M26 72 h70 v28 c0 24 -14 36 -36 36 c-20 0 -34 -12 -34 -34z" />
      <!-- knuckle creases (dorsal side) -->
      <path class="knuckle" d="M31 50 q4 2 8 0 M31 54 q4 1.5 8 0" />
      <path class="knuckle" d="M49 42 q4 2 8 0 M49 46 q4 1.5 8 0" />
      <path class="knuckle" d="M67 46 q4 2 8 0 M67 50 q4 1.5 8 0" />
      <path class="knuckle" d="M84.5 60 q3.5 2 7 0" />
      <path class="knuckle knuckle--soft" d="M32 80 q3 -3 6 0 M50 79 q3 -3 6 0 M68 80 q3 -3 6 0 M85 82 q2.5 -2.5 5 0" />
      <!-- nails: flat top at the tip, rounded cuticle toward the hand -->
      <path class="nail" d="M30.5 23 h9 v9 q0 6 -4.5 6 q-4.5 0 -4.5 -6z" />
      <path class="nail" d="M48.5 11 h9 v10 q0 6 -4.5 6 q-4.5 0 -4.5 -6z" />
      <path class="nail" d="M66.5 17 h9 v9 q0 6 -4.5 6 q-4.5 0 -4.5 -6z" />
      <path class="nail" d="M84.2 35 h7.6 v7 q0 5 -3.8 5 q-3.8 0 -3.8 -5z" />
      <path class="nail-paint" data-nail="3" d="M30.5 23 h9 v9 q0 6 -4.5 6 q-4.5 0 -4.5 -6z" />
      <path class="nail-paint" data-nail="2" d="M48.5 11 h9 v10 q0 6 -4.5 6 q-4.5 0 -4.5 -6z" />
      <path class="nail-paint" data-nail="1" d="M66.5 17 h9 v9 q0 6 -4.5 6 q-4.5 0 -4.5 -6z" />
      <path class="nail-paint" data-nail="0" d="M84.2 35 h7.6 v7 q0 5 -3.8 5 q-3.8 0 -3.8 -5z" />
      <rect class="gloss" x="32.4" y="25" width="2" height="5" rx="1" />
      <rect class="gloss" x="50.4" y="13" width="2" height="5" rx="1" />
      <rect class="gloss" x="68.4" y="19" width="2" height="5" rx="1" />
      <rect class="gloss" x="85.8" y="37" width="1.8" height="4" rx=".9" />
    </g>
    <!-- polish brush (tip at 0,0) -->
    <g class="brush">
      <g class="brush__wiggle">
        <line class="brush__handle" x1="9" y1="-12" x2="30" y2="-44" />
        <rect class="brush__ferrule" x="4" y="-16" width="9" height="7" rx="2" transform="rotate(33 8.5 -12.5)" />
        <path class="brush__tip" d="M0 0 C-1 -5 2 -9 5 -11 L10 -8 C8 -4 4 -1 0 0Z" />
      </g>
    </g>
    <!-- sparkles -->
    <g class="sparkles">
      <path d="M100 18 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" />
      <path d="M14 40 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" />
      <path d="M106 70 l1.2 3.6 3.6 1.2 -3.6 1.2 -1.2 3.6 -1.2 -3.6 -3.6 -1.2 3.6 -1.2z" />
    </g>
  </svg>
</div>
<p class="cursor-hint" role="note"><span aria-hidden="true">💅</span> {{ t.ui.cursor_hint }}</p>
